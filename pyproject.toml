[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crea-traffic"
version = "1.0.0"
description = "Causal Relational Expert Aggregation for Traffic Forecasting"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Jia Rong"}, {name = "Guanchao Tong"}]
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.10,<2",
  "networkx>=3.1,<4", "scikit-learn>=1.3,<2", "requests>=2.31,<3",
  "PyYAML>=6,<7", "torch>=2.1,<3", "tables>=3.8,<4",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
crea = "crea:main"

[tool.setuptools]
packages = ["rpv_data", "rpv_experiments"]
py-modules = ["crea"]
